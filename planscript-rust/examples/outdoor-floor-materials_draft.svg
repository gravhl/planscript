  <path d="M 97.90 630.32 L 448.87 630.32 L 448.87 235.48 L 97.90 235.48 Z" fill="url(#floor-material-hardwood)" stroke="#707070" stroke-width="1" />
    <path d="M 448.87 630.32 L 712.10 630.32 L 712.10 235.48 L 448.87 235.48 Z" fill="url(#floor-material-tile)" stroke="#707070" stroke-width="1" />

