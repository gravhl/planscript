<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="800" viewBox="0 0 1000 800">
  <defs>
    <style>
      .room-label { font-family: Arial, sans-serif; font-weight: 500; }
    </style>
    <pattern id="floor-material-hardwood" patternUnits="userSpaceOnUse" width="18" height="18">
          <rect width="18" height="18" fill="#ffffff" />
          <path d="M 0 6 H 18 M 0 12 H 18 M 9 0 V 6 M 4 6 V 12 M 13 12 V 18" stroke="#111111" stroke-width="0.7" opacity="0.85" />
        </pattern>
    <pattern id="floor-material-tile" patternUnits="userSpaceOnUse" width="14" height="14">
          <rect width="14" height="14" fill="#ffffff" />
          <path d="M 14 0 V 14 M 0 14 H 14" stroke="#111111" stroke-width="0.65" opacity="0.85" />
        </pattern>
    <pattern id="floor-material-wood-deck" patternUnits="userSpaceOnUse" width="18" height="18">
