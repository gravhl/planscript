    <rect x="787.00" y="216.00" width="18" height="12" fill="url(#floor-material-pavers)" stroke="#111111" stroke-width="0.8" />
    <text x="813.00" y="222.00" font-size="10" fill="#111111" dominant-baseline="middle" font-family="Arial, sans-serif">Pavers</text>
    <rect x="787.00" y="238.00" width="18" height="12" fill="url(#floor-material-tile)" stroke="#111111" stroke-width="0.8" />
