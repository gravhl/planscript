    <text class="room-label" data-room-label="kitchen" x="580.48" y="432.90" font-size="14" fill="#111111" text-anchor="middle" dominant-baseline="middle" font-family="Arial, sans-serif">Kitchen</text>
    <text class="outdoor-label" data-outdoor-label="rear_deck" x="273.39" y="147.74" font-size="11.479999999999999" fill="#111111" text-anchor="middle" dominant-baseline="middle" font-family="Arial, sans-serif" font-style="italic">Rear Deck</text>
    <text class="outdoor-label" data-outdoor-label="kitchen_patio" x="580.48" y="147.74" font-size="11.479999999999999" fill="#111111" text-anchor="middle" dominant-baseline="middle" font-family="Arial, sans-serif" font-style="italic">Patio</text>
    <text class="outdoor-label" data-outdoor-label="entry_walk" x="295.32" y="685.16" font-size="11.479999999999999" fill="#111111" text-anchor="middle" dominant-baseline="middle" font-family="Arial, sans-serif" font-style="italic">Entry Walk</text>

