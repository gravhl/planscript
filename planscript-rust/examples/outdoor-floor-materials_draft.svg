  <g class="outdoor-area outdoor-deck" data-outdoor="rear_deck" data-outdoor-kind="Deck">
    <path d="M 97.90 235.48 L 448.87 235.48 L 448.87 60.00 L 97.90 60.00 Z" fill="url(#floor-material-wood-deck)" stroke="#111111" stroke-width="1.25" stroke-dasharray="3,2" />
  </g>
    <g class="outdoor-area outdoor-patio" data-outdoor="kitchen_patio" data-outdoor-kind="Patio">
    <path d="M 448.87 235.48 L 712.10 235.48 L 712.10 60.00 L 448.87 60.00 Z" fill="url(#floor-material-pavers)" stroke="#111111" stroke-width="1.25" stroke-dasharray="3,2" />
  </g>
    <g class="outdoor-area outdoor-walkway" data-outdoor="entry_walk" data-outdoor-kind="Walkway">
    <path d="M 229.52 740.00 L 361.13 740.00 L 361.13 630.32 L 229.52 630.32 Z" fill="url(#floor-material-concrete)" stroke="#111111" stroke-width="1.25" stroke-dasharray="3,2" />
  </g>

