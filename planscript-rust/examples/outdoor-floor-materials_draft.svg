          <path d="M -3 12 L 12 -3 M 3 15 L 15 3" stroke="#111111" stroke-width="0.6" opacity="0.85" />
        </pattern>
  </defs>

  <!-- Background -->
  <rect width="1000" height="800" fill="#ffffff" />

  <!-- Footprint (boundary) -->
  <path d="M 97.90 630.32 L 712.10 630.32 L 712.10 235.48 L 97.90 235.48 Z" fill="none" stroke="#333333" stroke-width="2" stroke-dasharray="8,4" />

