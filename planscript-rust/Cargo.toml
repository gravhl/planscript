[package]
name = "planscript-rust"
version = "0.1.0"
edition = "2021"
description = "Rust implementation of the PlanScript floor plan compiler and solver"
license = "MIT"

[lib]
name = "planscript"
path = "src/lib.rs"

[[bin]]
name = "planscript-rust"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

